[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "AzimMakhkamov",email = "azimmakhkamov09@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standart] (>=0.52.3,<0.53.0)",
    "sqlalchemy[asyncio] (>=2.0.52,<3.0.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pydantic[email] (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "redis[hiredis] (>=8.1.0,<9.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "aiosmtplib (>=5.1.2,<6.0.0)",
    "python-slugify (>=8.0.4,<9.0.0)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "pillow (>=12.3.0,<13.0.0)"
]

[tool.poetry]
packages = [{include = "backend", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
